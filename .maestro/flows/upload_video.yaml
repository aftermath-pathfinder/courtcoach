appId: com.courtcoach.web
---
# Flow: Upload a video and see coaching feedback
# Prerequisites:
#   - frontend running on localhost:5173
#   - backend running on localhost:8000
#   - tests/fixtures/sample_forehand.mp4 must exist (add a real ~5s forehand clip)

- launchApp:
    browser: chrome
    url: "http://localhost:5173"

- assertVisible: "CourtCoach"

- assertVisible: "Drag and drop your swing video here"

- tapOn:
    id: "file-input"

- inputFile: "tests/fixtures/sample_forehand.mp4"

- assertVisible: "Analysing your swing"

- waitForAnimationToEnd:
    timeout: 30000

- assertVisible: "Analysis complete"

- assertVisible: "elbow"

- assertNotVisible: "Something went wrong"
